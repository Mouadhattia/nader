# /etc/nginx/sites-available/api.mouadhattia.xyz
#
# Matches the live server config, with two corrections:
#   1. Connection header uses the $connection_upgrade map (see
#      websocket-upgrade.conf) instead of a hardcoded "upgrade", so normal
#      REST calls are no longer told to upgrade.
#   2. A dedicated /socket.io/ block with buffering off and a long idle
#      timeout, for the Raspberry Pi's long-lived WebSocket.
#
# Certbot-managed lines are kept verbatim so `certbot renew` keeps working.

server {
    server_name api.mouadhattia.xyz;

    # Guest recordings; multer's own cap is 50MB.
    client_max_body_size 200M;

    # Long-lived Socket.IO connection from the Raspberry Pi phone button.
    # Declared before `location /` for clarity; nginx prefix-matches the
    # longest location regardless of order.
    location /socket.io/ {
        proxy_pass http://127.0.0.1:6321;
        proxy_http_version 1.1;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Idle WebSockets must outlive socket.io's 25s ping interval.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering    off;
    }

    # REST API, uploaded audio, health check.
    location / {
        proxy_pass http://127.0.0.1:6321;
        proxy_http_version 1.1;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 600;
        proxy_send_timeout 600;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/api.mouadhattia.xyz/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/api.mouadhattia.xyz/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = api.mouadhattia.xyz) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name api.mouadhattia.xyz;
    return 404; # managed by Certbot
}
