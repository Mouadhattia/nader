# /etc/nginx/sites-available/mouadhattia.xyz
#
# Frontend vhost. Serves the built single-file Vite app.
# The browser talks to the API at https://api.mouadhattia.xyz (baked in at
# build time from .env.production), so this vhost needs no /socket.io/ block.
#
# Two options below — keep whichever matches how you run the frontend.

server {
    listen 80;
    listen [::]:80;
    server_name mouadhattia.xyz www.mouadhattia.xyz;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mouadhattia.xyz www.mouadhattia.xyz;

    ssl_certificate     /etc/letsencrypt/live/mouadhattia.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mouadhattia.xyz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # ── Option A (current setup): proxy to `vite preview` on port 3331 ───────
    location / {
        proxy_pass http://127.0.0.1:3331;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Option B (recommended): serve dist/ straight from nginx ──────────────
    # Removes a whole Node process and gzips the 420KB single-file bundle.
    # To use it, comment out Option A above and uncomment this block, then
    # remove the agb-web app from PM2 (`pm2 delete agb-web && pm2 save`).
    #
    # root /var/www/html/nader/dist;
    # index index.html;
    #
    # gzip on;
    # gzip_types text/html text/css application/javascript image/svg+xml;
    # gzip_min_length 1024;
    #
    # location / {
    #     try_files $uri $uri/ /index.html;   # SPA fallback for /admin and /guest
    # }
}
