# /etc/nginx/conf.d/websocket-upgrade.conf
#
# Maps the Upgrade request header to the right Connection value:
#   real WebSocket upgrade  -> Connection: upgrade
#   plain XHR-polling call  -> Connection: close
#
# Socket.IO starts on HTTP long-polling and then upgrades, so it needs both.
# This lives in the http{} context, which is why it is its own file in
# conf.d/ rather than inside a server{} block.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
